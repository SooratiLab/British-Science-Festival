services:

  # --- SLAM: mapping mode ---
  slam-mapping:
    build: .
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./config:/ros2_ws/config
      - ./launch:/ros2_ws/launch
    command: ros2 launch /ros2_ws/launch/slam_mapping.launch.py
    restart: unless-stopped

  # --- localization: navigation with saved map ---
  slam-localization:
    build: .
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./config:/ros2_ws/config
      - ./launch:/ros2_ws/launch
    command: ros2 launch /ros2_ws/launch/slam_localization.launch.py
    restart: unless-stopped
    profiles: ['localization']

  # --- Rosbridge for Pi5 & Foxglove ---
  rosbridge:
    image: ros:humble-ros-base
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    command: >
      sh -c "apt-get update &&
             apt-get install -y ros-humble-rosbridge-server &&
             source /opt/ros/humble/setup.bash &&
             ros2 run rosbridge_server rosbridge_websocket --ros-args -p port:=9090"
    restart: unless-stopped
    profiles: ['localization']

